name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: portal-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Build, lint and dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify generated API types are current
        run: npm run api:check

      - name: Type-check and production build
        run: npm run build

      - name: Lint without warnings
        run: npm run lint -- --deny-warnings

      - name: Run unit and integration tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run requester browser smoke test
        run: npm run test:e2e

      - name: Build and verify hardened production image
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=https://api.example.test/api/v1 \
            --tag isd-portal:ci .
          docker run --detach --rm \
            --name isd-portal-ci \
            --publish 127.0.0.1:8080:8080 \
            --env PORTAL_API_ORIGIN=https://api.example.test \
            --read-only \
            --tmpfs /tmp \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            isd-portal:ci
          trap 'docker stop isd-portal-ci' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent --dump-header /tmp/portal-headers \
            --output /tmp/portal-body http://127.0.0.1:8080/tickets
          grep --fixed-strings --ignore-case \
            "content-security-policy: default-src 'self';" /tmp/portal-headers
          grep --fixed-strings --ignore-case \
            "connect-src 'self' https://api.example.test;" /tmp/portal-headers
          grep --fixed-strings --ignore-case \
            "x-content-type-options: nosniff" /tmp/portal-headers
          grep --fixed-strings --ignore-case \
            "x-frame-options: DENY" /tmp/portal-headers
          grep --fixed-strings '<div id="root"></div>' /tmp/portal-body
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:8080 npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
