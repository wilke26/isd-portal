name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: portal-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Build, lint and dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify generated API types are current
        run: npm run api:check

      - name: Type-check and production build
        run: npm run build

      - name: Lint without warnings
        run: npm run lint -- --deny-warnings

      - name: Run API contract tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
